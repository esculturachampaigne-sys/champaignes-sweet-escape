<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Champaigne's Sweet Escape</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Champaigne's Sweet Escape</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li> 
        </ul>
    </nav>
</header>

<main>

    <article class="product-card">

    <h2>Contact Us</h2>

    <form>
        <fieldset>
            <legend>Your Details</legend>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="subject">Subject</label>
            <select id="subject" name="subject">
                <option value="order">Order Inquiry</option>
                <option value="product">Product Question</option>
                <option value="feedback">Feedback</option>
                <option value="other">Other</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" cols="40" required></textarea>

            <button type="submit">Send Message</button>
        </fieldset>
    </form>
    <p>Sweet moments start with a message. Contact us for inquiries or any questions you may have.</p>

    <ul>
        <li>Email: champaignesweetescape@gmail.com</li>
        <li>Facebook: Champaigne's Sweet Escape</li>
    </ul>

</article>
</main>

<footer>
    <p>© 2026 Champaigne's Sweet Escape</p>
</footer>

</body>
</html>
